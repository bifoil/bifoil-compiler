# Supply authentication through SONAR_TOKEN; keep tokens outside repository files.
sonar.projectKey=bifoil_bifoil-compiler
sonar.organization=bifoil
sonar.sourceEncoding=UTF-8
sonar.scanner.autoconfig.enabled=false
sonar.working.directory=.bifoil/development/sonar/scanner-work
sonar.sources=src,tools
sonar.tests=src,tests,tools
sonar.test.inclusions=tests/**,src/tests.rs,src/tests/**,src/**/tests.rs,src/**/tests/**,tools/test_*.py
sonar.python.version=3.11
sonar.rust.clippyReport.reportPaths=.bifoil/development/sonar/clippy.jsonl
