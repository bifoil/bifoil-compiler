[package]
name = "bifoil-compiler"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "bifoilc"
path = "src/main.rs"

[dependencies]
rpds = "1.2.1"
redb = { version = "=4.4.0", default-features = false }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = { version = "1.0", features = ["float_roundtrip", "raw_value"] }
sha2 = "0.11"
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde", "std"] }

[profile.release]
opt-level = 2
strip = true
